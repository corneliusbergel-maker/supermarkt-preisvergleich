name: CI

# Baut und testet auf einem echten macOS-Rechner bei GitHub.
# Fuer oeffentliche Repositories ist das kostenlos und unbegrenzt
# (Standard-Runner). Siehe KOSTEN.md.

on:
  push:
    branches: [main]
    # Reine Dokumentationsaenderungen loesen keinen Lauf aus. Der
    # Screenshot-Job belegt rund sechs Minuten Runner-Zeit - die soll nicht
    # fuer eine Textkorrektur draufgehen.
    paths-ignore:
      - '**.md'
      - 'Referenzen/**'
  pull_request:
  workflow_dispatch:        # erlaubt manuellen Start ueber die GitHub-Oberflaeche

# Laeuft ein neuer Push, wird der vorherige Lauf abgebrochen.
# Spart Laufzeit und haelt die Rueckmeldung schnell.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  price-core:
    name: PriceCore - Logik & Tests
    runs-on: macos-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Werkzeugversionen protokollieren
        run: |
          echo "### Umgebung" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          swift --version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Beschleunigt Folgelaeufe. Beim ersten Lauf gibt es noch nichts zu holen.
      - name: Build-Zwischenstand zwischenspeichern
        uses: actions/cache@v6
        with:
          path: Packages/PriceCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/PriceCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Kompilieren
        working-directory: Packages/PriceCore
        run: swift build

      - name: Tests ausfuehren
        working-directory: Packages/PriceCore
        run: swift test

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Alle PriceCore-Tests sind gruen." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Fehler - siehe Protokoll des Schritts oben." >> "$GITHUB_STEP_SUMMARY"
          fi

  app:
    name: App bauen (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      # Ein Fehler auf einer Plattform soll die anderen nicht verdecken -
      # wir wollen alle Fehler auf einmal sehen, nicht nacheinander.
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: Mac Catalyst
            destination: platform=macOS,variant=Mac Catalyst

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Bauen
        run: |
          # Vollstaendig protokollieren und bei einem Fehler gezielt die
          # Compiler-Meldungen zeigen. Ein blosses `tail` schneidet sie ab --
          # xcodebuild haengt danach noch viel Rauschen an.
          if ! xcodebuild build \
              -project Preisfuchs.xcodeproj \
              -scheme Preisfuchs \
              -configuration Debug \
              -destination '${{ matrix.destination }}' \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::group::Compiler-Fehler"
            grep -E "error:" build.log | head -40 || tail -80 build.log
            echo "::endgroup::"
            exit 1
          fi
          echo "Build erfolgreich."

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ${{ matrix.name }} baut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ${{ matrix.name }} schlaegt fehl." >> "$GITHUB_STEP_SUMMARY"
          fi

  ipa:
    name: Unsignierte IPA bauen
    runs-on: macos-latest
    needs: app

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Fuer das Geraet archivieren
        run: |
          # Ohne Signatur: Die Signatur setzt ein Apple-Entwicklerkonto
          # voraus, das an diesen Runner nicht gebunden ist. Signiert wird
          # spaeter auf dem Windows-Rechner mit der eigenen Apple-ID.
          if ! xcodebuild archive \
              -project Preisfuchs.xcodeproj \
              -scheme Preisfuchs \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Preisfuchs.xcarchive \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              > archive.log 2>&1; then
            echo "::group::Fehler"
            grep -E "error:" archive.log | head -40 || tail -80 archive.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Zur IPA verpacken
        run: |
          set -euo pipefail
          APP="build/Preisfuchs.xcarchive/Products/Applications/Preisfuchs.app"
          if [ ! -d "$APP" ]; then
            echo "Erwartete App nicht gefunden. Inhalt des Archivs:"
            find build/Preisfuchs.xcarchive/Products -maxdepth 3
            exit 1
          fi

          # Eine IPA ist nichts weiter als ein Zip mit einem Ordner "Payload".
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry Preisfuchs-unsigned.ipa Payload)

          ls -lh build/Preisfuchs-unsigned.ipa
          echo "### Unsignierte IPA gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sie ist **nicht** signiert und laesst sich so nicht installieren." >> "$GITHUB_STEP_SUMMARY"
          echo "Signieren mit der eigenen Apple-ID - siehe AUF-DEM-IPHONE.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Preisfuchs-unsigned-ipa
          path: build/Preisfuchs-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  screenshots:
    name: Screenshots (${{ matrix.device }})
    runs-on: macos-latest
    needs: app
    strategy:
      fail-fast: false
      matrix:
        # iPhone zeigt das kompakte Layout mit Tab-Leiste,
        # iPad das breite mit Seitenleiste.
        device: [iPhone, iPad]

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Simulator waehlen und starten
        id: sim
        run: |
          set -euo pipefail
          # Geraet nicht fest verdrahten - die verfuegbaren Modelle aendern
          # sich mit jeder Xcode-Version. Stattdessen das erste passende nehmen.
          UDID=$(xcrun simctl list devices available \
            | grep -E "^\s+${{ matrix.device }}" \
            | head -1 \
            | grep -oE "[0-9A-Fa-f-]{36}")
          if [ -z "$UDID" ]; then
            echo "Kein ${{ matrix.device }}-Simulator gefunden:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Gewaehlt: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Bauen und installieren
        run: |
          if ! xcodebuild build \
              -project Preisfuchs.xcodeproj \
              -scheme Preisfuchs \
              -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::group::Compiler-Fehler"
            grep -E "error:" build.log | head -40 || tail -80 build.log
            echo "::endgroup::"
            exit 1
          fi
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Aufnehmen
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          # Statusleiste festsetzen, damit die Bilder vergleichbar bleiben.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true

          mkdir -p screenshots

          # Nimmt ein Bild auf: App neu starten, warten, fotografieren.
          # $1 = Dateiname, $2 = Wartezeit in Sekunden, Rest = Startparameter.
          shot() {
            local name="$1" wait="$2"
            shift 2
            xcrun simctl terminate "$UDID" de.preisfuchs.app 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$UDID" de.preisfuchs.app "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/${{ matrix.device }}-$name.png"
          }

          # 1) Startseite OHNE Standort - so sieht die App direkt nach der
          # Installation aus. Beim ersten Bild laenger warten: Ein frisch
          # gebooteter Simulator wirft Systembanner ein ("Ready for Apple
          # Intelligence"), die erst nach einigen Sekunden verschwinden.
          shot 01-Start-ohne-Standort 22

          # Ab hier MIT Standort: Freigabe erteilen und Berlin-Mitte setzen.
          # Alle folgenden Daten kommen trotzdem aus den echten APIs.
          xcrun simctl privacy "$UDID" grant location de.preisfuchs.app || true
          xcrun simctl location "$UDID" set 52.520008,13.404954 || true

          shot 02-Start 20
          shot 03-Suche 15 -uiTab search -uiQuery nutella
          # Wagner Big City Cheese 415 g, EAN 4009233005802 - eines der wenigen
          # Markenprodukte mit belegten Preisen in Berlin (2026-09-11: zwei).
          shot 04-Produkt 20 -uiTab search -uiBarcode 4009233005802
          # Nutella 400 g, EAN 3017620422003 - 165 Preise weltweit, keiner aus
          # Deutschland. Zeigt den ehrlichen Leerzustand statt Auslandspreisen.
          shot 04b-Produkt-ohne-deutsche-Preise 20 -uiTab search -uiBarcode 3017620422003
          shot 05-Filialen 25 -uiRoute stores
          shot 06-Favoriten 8 -uiTab favorites
          shot 07-Liste 8 -uiTab list
          shot 08-Einstellungen 8 -uiTab settings

          ls -la screenshots

      - name: Hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.device }}
          path: screenshots/
          if-no-files-found: warn
