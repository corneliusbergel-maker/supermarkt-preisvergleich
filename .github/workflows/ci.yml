name: CI

# Baut und testet auf einem echten macOS-Rechner bei GitHub.
# Fuer oeffentliche Repositories ist das kostenlos und unbegrenzt
# (Standard-Runner). Siehe KOSTEN.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # erlaubt manuellen Start ueber die GitHub-Oberflaeche

# Laeuft ein neuer Push, wird der vorherige Lauf abgebrochen.
# Spart Laufzeit und haelt die Rueckmeldung schnell.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  price-core:
    name: PriceCore - Logik & Tests
    runs-on: macos-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Werkzeugversionen protokollieren
        run: |
          echo "### Umgebung" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          swift --version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Beschleunigt Folgelaeufe. Beim ersten Lauf gibt es noch nichts zu holen.
      - name: Build-Zwischenstand zwischenspeichern
        uses: actions/cache@v6
        with:
          path: Packages/PriceCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/PriceCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Kompilieren
        working-directory: Packages/PriceCore
        run: swift build

      - name: Tests ausfuehren
        working-directory: Packages/PriceCore
        run: swift test

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Alle PriceCore-Tests sind gruen." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Fehler - siehe Protokoll des Schritts oben." >> "$GITHUB_STEP_SUMMARY"
          fi

  app:
    name: App bauen (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      # Ein Fehler auf einer Plattform soll die anderen nicht verdecken -
      # wir wollen alle Fehler auf einmal sehen, nicht nacheinander.
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: Mac Catalyst
            destination: platform=macOS,variant=Mac Catalyst

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project Preisfuchs.xcodeproj \
            -scheme Preisfuchs \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tail -60

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ${{ matrix.name }} baut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ${{ matrix.name }} schlaegt fehl." >> "$GITHUB_STEP_SUMMARY"
          fi

# Sobald die Builds stabil gruen sind, kommt ein Screenshot-Job dazu: Simulator
# starten, App oeffnen, Bildschirmfotos als Artefakt hochladen. Dann sind alle
# drei Layouts sichtbar, ohne einen Mac zu besitzen.
