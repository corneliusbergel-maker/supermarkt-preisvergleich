        schema:
          type: number
      - in: query
        name: date__year
        schema:
          type: number
      - in: query
        name: discount_type
        schema:
          type: string
          nullable: true
          enum:
          - EXPIRES_SOON
          - LOYALTY_PROGRAM
          - OTHER
          - PICK_IT_YOURSELF
          - QUANTITY
          - SALE
          - SEASONAL
          - SECOND_HAND
        description: |-
          * `QUANTITY` - QUANTITY
          * `SALE` - SALE
          * `SEASONAL` - SEASONAL
          * `LOYALTY_PROGRAM` - LOYALTY_PROGRAM
          * `EXPIRES_SOON` - EXPIRES_SOON
          * `PICK_IT_YOURSELF` - PICK_IT_YOURSELF
          * `SECOND_HAND` - SECOND_HAND
          * `OTHER` - OTHER
      - in: query
        name: duplicate_of__isnull
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - COMMUNITY
          - CONSUMPTION
        description: |-
          * `COMMUNITY` - COMMUNITY
          * `CONSUMPTION` - CONSUMPTION
      - in: query
        name: labels_tags__contains
        schema:
          type: string
      - in: query
        name: lat
        schema:
          type: number
        description: Latitude of the center point (-90 to 90). Must be sent together
          with lon and radius_km.
      - in: query
        name: location__osm_name__contains
        schema:
          type: string
      - in: query
        name: location__type
        schema:
          type: string
          enum:
          - ONLINE
          - OSM
        description: |-
          * `OSM` - OSM
          * `ONLINE` - ONLINE
      - in: query
        name: location_id
        schema:
          type: integer
      - in: query
        name: location_id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: location_id__isnull
        schema:
          type: boolean
      - in: query
        name: location_osm_id
        schema:
          type: integer
      - in: query
        name: location_osm_type
        schema:
          type: string
          nullable: true
          enum:
          - NODE
          - RELATION
          - WAY
        description: |-
          * `NODE` - NODE
          * `WAY` - WAY
          * `RELATION` - RELATION
      - in: query
        name: lon
        schema:
          type: number
        description: Longitude of the center point (-180 to 180). Must be sent together
          with lat and radius_km.
