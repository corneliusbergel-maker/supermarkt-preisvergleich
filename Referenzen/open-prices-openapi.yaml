          description: ''
    patch:
      operationId: price_tags_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Price Tag.
        required: true
      tags:
      - price-tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagUpdate'
          description: ''
    delete:
      operationId: price_tags_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Price Tag.
        required: true
      tags:
      - price-tags
      security:
      - CustomAuthentication: []
      responses:
        '204':
          description: No response body
  /api/v1/prices:
