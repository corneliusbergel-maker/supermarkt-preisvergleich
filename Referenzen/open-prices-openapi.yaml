        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - badges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBadgeUserList'
          description: ''
  /api/v1/challenges:
    get:
      operationId: challenges_list
      parameters:
      - in: query
        name: end_date__gt
        schema:
          type: string
          format: date
      - in: query
        name: end_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: end_date__lt
        schema:
          type: string
          format: date
      - in: query
        name: end_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: end_date__month
        schema:
          type: number
      - in: query
        name: end_date__year
        schema:
          type: number
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: is_published
        schema:
          type: boolean
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: start_date__gt
        schema:
          type: string
          format: date
      - in: query
        name: start_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: start_date__lt
        schema:
          type: string
          format: date
      - in: query
        name: start_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: start_date__month
        schema:
          type: number
      - in: query
        name: start_date__year
        schema:
          type: number
      - in: query
        name: status
        schema:
          type: string
          enum:
          - COMPLETED
          - DRAFT
          - ONGOING
          - UPCOMING
        description: |-
          * `DRAFT` - DRAFT
          * `UPCOMING` - UPCOMING
          * `ONGOING` - ONGOING
          * `COMPLETED` - COMPLETED
      tags:
      - challenges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeList'
          description: ''
  /api/v1/challenges/{id}:
    get:
      operationId: challenges_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Challenge.
        required: true
      tags:
      - challenges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/v1/flags:
    get:
      operationId: flags_list
      parameters:
      - in: query
        name: content_type
        schema:
          type: array
          items:
            type: string
            title: Python model class name
            enum:
            - PRICE
            - PROOF
        description: |-
          * `PRICE` - Price
          * `PROOF` - Proof
        explode: true
        style: form
      - in: query
        name: object_id
        schema:
          type: integer
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: reason
        schema:
          type: array
          items:
            type: string
            enum:
            - OTHER
            - WRONG_CURRENCY
            - WRONG_DATE
            - WRONG_LOCATION
            - WRONG_PRICE_VALUE
            - WRONG_PRODUCT
            - WRONG_TYPE
        description: |-
          * `WRONG_TYPE` - Wrong type
          * `WRONG_PRICE_VALUE` - Wrong price value
          * `WRONG_CURRENCY` - Wrong currency
          * `WRONG_PRODUCT` - Wrong product
          * `WRONG_LOCATION` - Wrong location
          * `WRONG_DATE` - Wrong date
          * `OTHER` - Other
        explode: true
        style: form
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - OPEN
        description: |-
          * `OPEN` - Open
          * `CLOSED` - Closed
      tags:
      - moderation
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlagList'
          description: ''
  /api/v1/flags/{id}:
    patch:
      operationId: flags_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Flag.
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFlagUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFlagUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFlagUpdate'
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagUpdate'
          description: ''
  /api/v1/locations:
    get:
      operationId: locations_list
      parameters:
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: osm_address_city__like
        schema:
          type: string
      - in: query
        name: osm_address_country__like
        schema:
          type: string
      - in: query
        name: osm_name__like
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: price_count
        schema:
          type: integer
      - in: query
        name: price_count__gte
        schema:
          type: integer
      - in: query
        name: price_count__lte
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - ONLINE
          - OSM
        description: |-
          * `OSM` - OSM
          * `ONLINE` - ONLINE
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
    post:
      operationId: locations_create
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCreate'
          description: ''
  /api/v1/locations/{id}:
    get:
      operationId: locations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Location.
        required: true
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/v1/locations/compare:
    get:
      operationId: locations_compare_retrieve
      description: |-
        Compare two locations by their IDs.
        Returns shared product prices with the latest price per location,
        the date of that price, and the total sum.
      parameters:
      - in: query
        name: date__gte
        schema:
          type: string
          format: date
        description: Filter prices with date greater than or equal to this date (YYYY-MM-DD)
      - in: query
        name: date__lte
        schema:
          type: string
          format: date
        description: Filter prices with date less than or equal to this date (YYYY-MM-DD)
      - in: query
        name: location_id_a
        schema:
          type: integer
        required: true
      - in: query
        name: location_id_b
        schema:
          type: integer
        required: true
      - in: query
        name: price_is_discounted
        schema:
          type: boolean
        description: Filter to keep only discounted or non-discounted prices
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCompare'
          description: ''
  /api/v1/locations/nearby:
    get:
      operationId: locations_nearby_list
      description: |-
        Return locations within a given radius of a center point.
        Results are ordered by distance (closest first), then by id.
        Each result includes a computed `distance_km` field.
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: float
        description: Latitude of the center point (decimal degrees, -90 to 90)
        required: true
      - in: query
        name: lon
        schema:
          type: number
          format: float
        description: Longitude of the center point (decimal degrees, -180 to 180)
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: radius_km
        schema:
          type: number
          format: float
        description: Search radius in kilometers (must be positive)
        required: true
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationNearbyList'
          description: ''
  /api/v1/locations/osm/{osm_type}/{osm_id}:
    get:
      operationId: locations_osm_retrieve
      parameters:
      - in: path
        name: osm_id
        schema:
          type: integer
        required: true
      - in: path
        name: osm_type
        schema:
          type: string
          enum:
          - NODE
          - RELATION
          - WAY
        required: true
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/v1/locations/osm/countries:
    get:
      operationId: locations_osm_countries_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountryList'
          description: ''
  /api/v1/locations/osm/countries/{country_code}/cities:
    get:
      operationId: locations_osm_countries_cities_list
      parameters:
      - in: path
        name: country_code
        schema:
          type: string
          pattern: ^\w{2}$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - locations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountryCityList'
          description: ''
  /api/v1/price-tags:
    get:
      operationId: price_tags_list
      parameters:
      - in: query
        name: created__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created__lte
        schema:
          type: string
          format: date-time
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: prediction_count
        schema:
          type: integer
      - in: query
        name: prediction_count__gte
        schema:
          type: integer
      - in: query
        name: prediction_count__lte
        schema:
          type: integer
      - in: query
        name: price_id
        schema:
          type: integer
      - in: query
        name: proof__location__osm_address_country_code
        schema:
          type: string
      - in: query
        name: proof__owner
        schema:
          type: string
      - in: query
        name: proof__ready_for_price_tag_validation
        schema:
          type: boolean
      - in: query
        name: proof_id
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: integer
          nullable: true
          enum:
          - 0
          - 1
          - 10
          - 2
          - 3
          - 4
          - 5
        description: |-
          The annotation status

          * `0` - deleted
          * `1` - linked_to_price
          * `2` - not_readable
          * `3` - truncated
          * `4` - not_price_tag
          * `5` - no_barcode
          * `10` - other
      - in: query
        name: status__isnull
        schema:
          type: boolean
      - in: query
        name: tags__contains
        schema:
          type: string
      - in: query
        name: tags__not_contains
        schema:
          type: string
      tags:
      - price-tags
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPriceTagFullList'
          description: ''
    post:
      operationId: price_tags_create
      tags:
      - price-tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
        required: true
      security:
      - CustomAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagCreate'
          description: ''
  /api/v1/price-tags/{id}:
