        name: product__categories_tags__contains
        schema:
          type: string
      - in: query
        name: product__categories_tags__overlap
        schema:
          type: array
          items:
            type: array
            items:
              type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product__source
        schema:
          type: string
          nullable: true
          enum:
          - obf
          - 'off'
          - opf
          - opff
        description: |-
          * `off` - off
          * `obf` - obf
          * `opff` - opff
          * `opf` - opf
      - in: query
        name: product__source__isnull
        schema:
          type: boolean
      - in: query
        name: product_code
        schema:
          type: string
      - in: query
        name: product_code__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product_code__isnull
        schema:
          type: boolean
      - in: query
        name: product_id
        schema:
          type: integer
      - in: query
        name: product_id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product_id__isnull
        schema:
          type: boolean
      - in: query
        name: product_name
        schema:
          type: string
      - in: query
        name: proof__type
        schema:
          type: array
          items:
            type: string
            enum:
            - GDPR_REQUEST
            - PRICE_TAG
            - RECEIPT
            - SHOP_IMPORT
        description: |-
          * `PRICE_TAG` - PRICE_TAG
          * `RECEIPT` - RECEIPT
          * `GDPR_REQUEST` - GDPR_REQUEST
          * `SHOP_IMPORT` - SHOP_IMPORT
        explode: true
        style: form
      - in: query
        name: proof_id
        schema:
          type: integer
      - in: query
        name: proof_id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: proof_id__isnull
        schema:
          type: boolean
      - in: query
        name: radius_km
        schema:
          type: number
        description: Search radius in kilometers (0 or more). Must be sent together
          with lat and lon.
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: tags__contains
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - CATEGORY
          - PRODUCT
        description: |-
          * `PRODUCT` - PRODUCT
          * `CATEGORY` - CATEGORY
